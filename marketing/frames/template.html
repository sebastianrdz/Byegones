<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Byegones App Store frame</title>
<style>
  :root { --indigo:#4A3FD1; --indigo-deep:#3A30B8; --on:#FFFFFF; --bezel:#17161B; --screen-w:1000px; }
  * { box-sizing:border-box; margin:0; }
  html, body { width:1320px; height:2868px; overflow:hidden; }
  body {
    background: radial-gradient(1400px 1000px at 50% 0%, #5B50E6 0%, var(--indigo) 55%, var(--indigo-deep) 100%);
    font-family: ui-rounded, "SF Pro Rounded", "SF Pro Display", -apple-system, "Helvetica Neue", sans-serif;
    display:flex; flex-direction:column; align-items:center;
  }
  .caption {
    margin-top:150px; height:300px; width:1120px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    color:var(--on); font-weight:800; font-size:108px; line-height:1.08; letter-spacing:-1px;
    text-wrap:balance;
  }
  .phone {
    margin-top:70px;
    padding:28px; border-radius:150px; background:var(--bezel);
    box-shadow: 0 0 0 4px #3a3942 inset, 0 50px 120px rgba(0,0,0,.35);
  }
  .screen { width:var(--screen-w); aspect-ratio:1320/2868; border-radius:122px; overflow:hidden; background:#000; }
  .screen img { display:block; width:100%; height:100%; object-fit:cover; }
</style>
</head>
<body>
  <div class="caption" id="cap"></div>
  <div class="phone"><div class="screen"><img id="shot" alt=""></div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.documentElement.lang = q.get('lang') || 'en';
  document.getElementById('cap').textContent = q.get('cap') || '';
  document.getElementById('shot').src = q.get('img') || '';
</script>
</body>
</html>
